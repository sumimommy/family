<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffb15c">
<title>우리 가족 앱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7ec;--card:#fff;--ink:#3b2f2a;--sub:#8a7b72;--line:#f0e2d2;--orange:#ff9f43;--blue:#4ea8ff;--green:#3cc47c;--purple:#9b7bff;--pink:#ff7aa2;--yellow:#ffd25e;--red:#ff5f5f;--acc:#ff9f43}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;font-family:'Gowun Dodum',system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--ink);background:var(--bg);background-image:radial-gradient(#f3e3cf 1.2px,transparent 1.2px);background-size:22px 22px;min-height:100vh}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
.j{font-family:'Jua',sans-serif;font-weight:normal}
h1,h2,h3{font-family:'Jua',sans-serif;font-weight:normal;margin:0}
#app{max-width:760px;margin:0 auto;padding:12px 14px 110px}
.top{display:flex;align-items:center;gap:10px;padding:6px 2px 14px}
.top .fam{font-family:'Jua';font-size:24px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me-btn{display:flex;align-items:center;gap:6px;background:#fff;border-radius:30px;padding:4px 12px 4px 4px;box-shadow:0 3px 0 var(--line);font-family:'Jua'}
.ava{display:inline-grid;place-items:center;border-radius:50%;background:var(--c,#ddd);flex:none;width:34px;height:34px;font-size:19px;line-height:1}
.ava.s{width:24px;height:24px;font-size:13px}
.ava.l{width:64px;height:64px;font-size:36px}
.ava.xl{width:84px;height:84px;font-size:48px}
.round{width:42px;height:42px;border-radius:50%;background:#fff;box-shadow:0 3px 0 var(--line);font-size:20px;display:grid;place-items:center}
.card{background:var(--card);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 4px 0 var(--line),0 8px 20px rgba(120,80,40,.06)}
.card h3{font-size:19px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.card h3 .more{margin-left:auto;font-family:'Gowun Dodum';font-size:14px;color:var(--sub)}
.btn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:'Jua';font-size:17px;padding:11px 18px;border-radius:16px;background:var(--acc);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.14)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.14)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.red{background:var(--red)}
.btn.sm{font-size:15px;padding:7px 12px;border-radius:12px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.inp{width:100%;border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:#fffdf9;outline:none}
.inp:focus{border-color:var(--acc)}
textarea.inp{resize:vertical;min-height:80px;line-height:1.5}
.row{display:flex;gap:8px;align-items:center}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--sub)}
.small{font-size:13px}
.center{text-align:center}
.empty{color:var(--sub);text-align:center;padding:14px 4px;font-size:15px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:20px;background:#fff6ea;border:2px solid var(--line);font-size:15px;white-space:nowrap}
.chip.on{background:var(--c,var(--acc));border-color:var(--c,var(--acc));color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.scroll-chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.scroll-chips::-webkit-scrollbar{display:none}
.lbl{font-size:14px;color:var(--sub);margin:12px 0 5px;display:block}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:2px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nav .in{display:flex;max-width:760px;width:100%}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:14px;font-family:'Jua';font-size:13px;color:var(--sub);position:relative}
.nav button .ic{font-size:24px;line-height:1.1;transition:transform .2s}
.nav button.on{color:var(--ink);background:#fff3e2}
.nav button.on .ic{transform:scale(1.18) translateY(-2px)}
.badge{position:absolute;top:0;right:calc(50% - 26px);background:var(--red);color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px;font-family:'Gowun Dodum'}

/* home */
.hello{background:linear-gradient(135deg,#ffb15c,#ff8a8a);color:#fff;border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:0 5px 0 #f0a07a;display:flex;align-items:center;gap:14px}
.hello .t{font-family:'Jua';font-size:24px}
.hello .d{opacity:.92;font-size:15px;margin-top:2px}
.ev{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:2px dashed var(--line);width:100%;text-align:left}
.ev:last-child{border-bottom:none}
.ev .em{font-size:24px;width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:#fff3e2;flex:none}
.ev .tm{font-size:13px;color:var(--sub)}
.ev .ti{font-family:'Jua';font-size:17px;line-height:1.25}
.ev .who{display:flex;margin-left:auto}
.ev .who .ava{margin-left:-6px;border:2px solid #fff}
.dday{font-family:'Jua';background:var(--purple);color:#fff;border-radius:12px;padding:4px 10px;font-size:15px;white-space:nowrap}
.dday.now{background:var(--green)}
.dday.past{background:#c9bdb2}
.day-head{font-family:'Jua';font-size:15px;color:var(--sub);margin:10px 0 2px}

/* calendar */
.cal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-top .m{font-family:'Jua';font-size:22px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .h{text-align:center;font-family:'Jua';font-size:13px;color:var(--sub);padding:2px 0 4px}
.cal .h:first-child{color:var(--red)}.cal .h:last-child{color:var(--blue)}
.cell{min-height:58px;border-radius:12px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px;background:#fffaf3;border:2px solid transparent}
.cell.out{opacity:.35}
.cell.sun .n,.cell.hol .n{color:var(--red)}
.cell.sat .n{color:var(--blue)}
.cell.today{background:#fff0d9}
.cell.today .n{background:var(--orange);color:#fff;border-radius:10px;padding:0 6px}
.cell.sel{border-color:var(--blue);background:#eef6ff}
.cell .n{font-family:'Jua';font-size:15px}
.cell .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:100%}
.cell .dots i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.cell .em{font-size:12px;line-height:1}
.hol-name{font-size:12px;color:var(--red);margin-left:6px}

/* shop */
.addbar{display:flex;gap:8px;margin-bottom:10px}
.addbar .inp{font-size:17px}
.item{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:2px dashed var(--line)}
.item:last-child{border-bottom:none}
.ck{width:32px;height:32px;border-radius:10px;border:3px solid #d8c7b5;display:grid;place-items:center;flex:none;font-size:18px;color:#fff;background:#fff}
.ck.on{background:var(--green);border-color:var(--green)}
.item .nm{font-size:18px;font-family:'Jua';line-height:1.25}
.item .meta{font-size:12px;color:var(--sub)}
.item.done .nm{text-decoration:line-through;color:#b5a596}
.x{width:32px;height:32px;border-radius:50%;color:#c4b1a0;font-size:18px;flex:none}
.x:hover{background:#fff1e4;color:var(--red)}

/* notes */
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.note{border-radius:18px;padding:14px;background:var(--nb,#fff8d6);box-shadow:0 4px 0 rgba(0,0,0,.06);position:relative;display:flex;flex-direction:column;gap:8px;transform:rotate(var(--rot,0deg))}
.note .tx{font-size:17px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.note .ft{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);margin-top:auto}
.note .act{display:flex;gap:4px;margin-left:auto}
.note .act button{padding:4px 6px;border-radius:10px;font-size:14px}
.note .act button:hover{background:rgba(255,255,255,.6)}
.pin{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:22px}

/* trip */
.trip-card{display:flex;gap:12px;align-items:center;width:100%;text-align:left}
.trip-card .te{font-size:34px;width:58px;height:58px;border-radius:18px;background:#f1ecff;display:grid;place-items:center;flex:none}
.tabs2{display:flex;gap:6px;margin:4px 0 14px;overflow-x:auto}
.tabs2 button{flex:1;padding:10px 8px;border-radius:14px;background:#fff;font-family:'Jua';font-size:15px;box-shadow:0 3px 0 var(--line);white-space:nowrap}
.tabs2 button.on{background:var(--purple);color:#fff;box-shadow:0 3px 0 #7a5ee0}
.bar{height:14px;border-radius:8px;background:#f3e9de;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--green));border-radius:8px;transition:width .5s}
.money{font-family:'Jua';font-size:24px}
.plan-item{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:2px dashed var(--line)}
.plan-item:last-child{border-bottom:none}
.plan-item .tm{font-family:'Jua';color:var(--purple);min-width:48px;font-size:15px}

/* modal */
#modal{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(60,40,30,.42)}
#modal.open{display:flex;animation:fd .2s}
#modal .sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,1.2,.4,1)}
@media(min-width:600px){#modal{align-items:center}#modal .sheet{border-radius:26px}}
#modal h2{font-size:22px;margin-bottom:6px}
@keyframes fd{from{opacity:0}}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.emo-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.emo-grid button{font-size:24px;height:42px;border-radius:10px;background:#fff8ef}
.emo-grid button.on{background:var(--acc);box-shadow:0 0 0 2px var(--acc)}
.sw{width:32px;height:32px;border-radius:50%;background:var(--c);border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.sw.on{box-shadow:0 0 0 3px var(--ink)}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:14px;z-index:80;font-size:15px;max-width:90vw;text-align:center;animation:up .25s}
.banner{background:#ffe3e3;color:#a33;border-radius:14px;padding:10px 14px;margin-bottom:12px;font-size:14px}
.hero{text-align:center;padding:30px 10px 10px}
.hero .big{font-size:72px;line-height:1}
.hero h1{font-size:30px;margin:10px 0 6px}
.mem-row{display:flex;gap:8px;align-items:center;padding:10px;border-radius:16px;background:#fff8ef;margin-bottom:8px;flex-wrap:wrap}
.who-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-top:16px}
.who-grid button{background:#fff;border-radius:22px;padding:18px 8px;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:8px;font-family:'Jua';font-size:20px}
.who-grid button:active{transform:translateY(3px)}
pre.code{background:#2f2520;color:#ffe9cf;border-radius:14px;padding:12px;font-size:12px;overflow:auto;white-space:pre}
.steps{padding-left:20px;line-height:1.7;margin:6px 0}
.pop{animation:popk .35s}
@keyframes popk{50%{transform:scale(1.25)}}
.fab{position:fixed;right:max(16px,calc(50% - 365px));bottom:86px;z-index:15;width:58px;height:58px;border-radius:50%;background:var(--acc);color:#fff;font-size:32px;box-shadow:0 5px 0 rgba(0,0,0,.15),0 8px 18px rgba(0,0,0,.15);display:grid;place-items:center}
</style>
<style>
/* ===== cozy RPG theme ===== */
:root{--bg:#efe0bf;--card:#fff8e6;--ink:#4a3424;--sub:#8b7259;--line:#e3cfa6;--wood:#6b4226;--wood2:#8a5a33}
html{background:#e7d5ae}
body{background:#e7d5ae;background-image:repeating-linear-gradient(90deg,rgba(120,80,40,.05) 0 2px,transparent 2px 60px),repeating-linear-gradient(0deg,rgba(120,80,40,.06) 0 3px,transparent 3px 34px)}
h1,h2,h3,.j{color:var(--ink)}
.card{background:var(--card);border:3px solid var(--wood);border-radius:14px;box-shadow:inset 0 0 0 3px #fff1cf,0 5px 0 #4a2f1a}
.btn{border:3px solid #4a3424;box-shadow:0 4px 0 #4a3424;border-radius:12px}
.btn:active{box-shadow:0 1px 0 #4a3424}
.btn.ghost{background:#fff3d6;border:3px solid #4a3424;box-shadow:0 4px 0 #4a3424}
.round,.me-btn{border:3px solid #4a3424;box-shadow:0 3px 0 #4a3424;background:#fff3d6}
.top .fam{text-shadow:0 2px 0 #fff3d6}
.inp{background:#fffdf5;border:2px solid #d4b98c}
.chip{background:#fff3d6;border:2px solid #d4b98c}
.tabs2 button{border:3px solid #4a3424;box-shadow:0 3px 0 #4a3424;background:#fff3d6}
.tabs2 button.on{background:#4e8cff;box-shadow:0 3px 0 #4a3424}
.note{border:3px solid rgba(74,52,36,.5)}
/* hotbar */
.nav{background:#4a3424;border-top:4px solid #2f1f13}
.nav button{color:#e9d3ae;margin:0 2px;border:3px solid transparent;font-size:12px;padding:4px 0}
.nav button .ic{width:38px;height:38px;display:grid;place-items:center;background:#6b4a30;border-radius:9px;border:2px solid #2f1f13;font-size:22px}
.nav button.on{background:none;color:#ffd25e}
.nav button.on .ic{background:#ffd25e;border-color:#fff3c4;transform:translateY(-4px) scale(1.06);box-shadow:0 0 12px rgba(255,210,94,.7)}
.badge{right:calc(50% - 28px)}
/* room sign */
.room-sign{display:flex;align-items:center;gap:12px;background:linear-gradient(#8a5a33,#6b4226);color:#fff3d6;border:3px solid #3c2615;border-radius:14px;padding:10px 12px;margin-bottom:14px;box-shadow:0 5px 0 #3c2615}
.room-sign .ri{font-size:34px;width:52px;height:52px;display:grid;place-items:center;background:#fff3d6;border-radius:12px;border:3px solid #3c2615}
.room-sign .rt{font-family:'Jua';font-size:21px;color:#fff3d6}
.room-sign .rs{font-size:13px;opacity:.85}
/* house scene */
.scene{position:relative;border:3px solid #4a3424;border-radius:18px;overflow:hidden;margin-bottom:16px;box-shadow:0 5px 0 #4a3424;padding-top:46px}
.scene.day{background:linear-gradient(#7fcbff,#c9ecff 70%)}
.scene.sunset{background:linear-gradient(#ff8f6b,#ffc98f 70%)}
.scene.night{background:linear-gradient(#141b45,#353b7a 75%)}
.scene .sun{position:absolute;top:8px;right:16px;font-size:36px}
.scene .cloud{position:absolute;font-size:30px;opacity:.95;animation:drift 26s linear infinite}
.scene .c1{top:8px;left:-40px}.scene .c2{top:30px;left:-40px;animation-delay:-13s;font-size:22px}
@keyframes drift{to{transform:translateX(820px)}}
.scene .star{position:absolute;font-size:14px;animation:tw 2.4s infinite}
.scene .s1{top:10px;left:14%}.scene .s2{top:26px;left:42%;font-size:11px;animation-delay:.8s}.scene .s3{top:8px;left:66%;animation-delay:1.5s}
@keyframes tw{50%{opacity:.25}}
.house{max-width:560px;margin:0 auto;padding:0 14px}
.roof{position:relative;height:66px;margin:0 -12px;background:#c4553b;clip-path:polygon(50% 0,100% 100%,0 100%);display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px}
.roof:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 3px,transparent 3px 14px)}
.sign{position:relative;background:#fff3d6;border:2px solid #4a3424;border-radius:8px;padding:2px 10px;font-family:'Jua';font-size:15px;color:#4a3424;white-space:nowrap;max-width:80%;overflow:hidden;text-overflow:ellipsis}
.body{background:#8a5a33;border:4px solid #4a3424;border-top:none;padding:5px 5px 0;display:flex;flex-direction:column;gap:5px}
.fl{display:grid;gap:5px}
.f2{grid-template-columns:1fr 1fr}.f1{grid-template-columns:1fr 1fr 1fr}
.room{position:relative;min-height:138px;background:var(--wall);border-bottom:9px solid #c08a55;display:flex;flex-direction:column;align-items:center;padding:7px 3px 4px;gap:3px;overflow:hidden;transition:filter .15s}
.room:hover{filter:brightness(1.05)}
.room:active{filter:brightness(.95)}
.room:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 10px,transparent 10px 20px);pointer-events:none}
.scene.night .room{box-shadow:inset 0 0 30px rgba(255,200,90,.35)}
.room .plate{position:relative;z-index:1;background:#6b4226;color:#fff3d6;font-family:'Jua';font-size:14px;padding:2px 9px;border-radius:7px;border:2px solid #3c2615;white-space:nowrap}
.room .rsub{position:relative;z-index:1;font-size:11px;color:#6b5040}
.room .rbadge{position:relative;z-index:1;background:#ff5f5f;color:#fff;font-size:11px;padding:1px 7px;border-radius:9px;border:2px solid #fff;font-family:'Jua'}
.room .sp{flex:1}
.room .chars{position:relative;z-index:1;display:flex;gap:2px;flex-wrap:wrap;justify-content:center;min-height:26px}
.room .ch{animation:hop 2.4s ease-in-out infinite;display:inline-block}
.room .ch.mine .ava{box-shadow:0 0 0 2px #fff,0 0 0 4px #ffb400}
@keyframes hop{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(-6px)}}
.room .fur{position:relative;z-index:1;font-size:21px;letter-spacing:2px;line-height:1}
.ground{display:flex;align-items:flex-end;justify-content:space-around;height:44px;background:#7cc66b;border-top:5px solid #5aa34d;font-size:24px;padding-bottom:4px;margin-top:-1px}
.scene.night .ground{background:#3f6e48;border-top-color:#2f5638}
.ground .path{width:46px;height:36px;background:#d9b98a;clip-path:polygon(30% 0,70% 0,100% 100%,0 100%)}
/* rpg window */
.rpg{background:#26203f;border:3px solid #fff;border-radius:12px;box-shadow:0 0 0 3px #26203f,0 7px 0 3px rgba(0,0,0,.25);padding:12px 12px 8px;margin:6px 3px 18px;color:#fff}
.rpg-t{font-family:'Jua';color:#ffd25e;font-size:16px;margin-bottom:6px}
.msg{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;padding:7px 4px;font-size:15px;line-height:1.45;border-radius:8px;color:inherit}
.msg:hover{background:rgba(255,255,255,.08)}
.rpg .arrow{color:#ffd25e;font-size:12px;margin-top:3px;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.2}}
.card .msg{border-bottom:2px dashed var(--line);border-radius:0}
.card .msg:last-child{border-bottom:none}
.msg .when{font-size:12px;color:var(--sub);white-space:nowrap;margin-top:2px}
/* diary */
.prompt{background:#f1e8ff;border:2px dashed #b9a3ff;border-radius:12px;padding:9px 12px;font-size:15px;color:#5b47a8}
.diary-page{background:#fffdf4;background-image:repeating-linear-gradient(0deg,transparent 0 31px,#efe2c4 31px 32px)}
.dentry{display:flex;gap:10px;padding:8px 0;border-bottom:2px dashed var(--line)}
.dentry:last-child{border-bottom:none}
.dentry .mood{font-size:34px;line-height:1}
.dwho{display:flex;align-items:center;gap:4px;font-family:'Jua';font-size:15px}
.dtx{font-size:17px;line-height:1.6;white-space:pre-wrap;word-break:break-word;margin-top:2px}
.mini-b{font-size:13px;padding:3px 8px;border-radius:9px;background:#fff3d6;border:2px solid #e3cfa6}
.emo-grid.pick1 button{font-size:22px;height:40px}
@media(max-width:400px){.room .fur{font-size:18px}.room .plate{font-size:13px;padding:2px 6px}.nav button{font-size:11px}.nav button .ic{width:34px;height:34px;font-size:20px}}

.att-h,.att-row{display:grid;grid-template-columns:minmax(76px,1fr) 66px auto;align-items:center;gap:6px}
.att-h{font-size:11px;color:var(--sub);padding:0 8px 4px}
.att-h span:nth-child(2){text-align:center}
.att-row{width:100%;text-align:left;padding:8px;border-radius:14px;background:linear-gradient(90deg,var(--mc) 0,#fffaf0 75%);border:2px solid #e3cfa6;margin-bottom:6px}
.att-row:active{transform:translateY(2px)}
.att-row.empty-mood{background:#fffaf0;border-style:dashed}
.att-who{display:flex;align-items:center;gap:6px;min-width:0;font-size:16px}
.att-who .j{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att-today{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.att-today b{font-size:30px;font-weight:normal}
.att-today b.q{opacity:.5;font-size:24px}
.att-today small{font-size:11px;color:#6b5040;white-space:nowrap}
.wk{display:grid;grid-template-columns:repeat(7,22px);gap:1px;text-align:center}
.wk i{font-style:normal;font-size:15px;color:#c8b28a}
.att-h .wk i{font-size:11px;color:var(--sub)}
.att-h .wk i.td{color:var(--ink);font-weight:bold}
.att-why{grid-column:1/-1;font-size:13px;color:#6b5040;padding-left:4px}
.mood-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mood-grid button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:14px;background:#fffaf0;border:2px solid #e3cfa6;font-size:12px;font-family:'Jua'}

<body>
<div id="app"></div>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<script>
(function(){
'use strict';
/* ===== helpers ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const rid=n=>{const a='abcdefghijkmnpqrstuvwxyz23456789';let s='';const r=new Uint32Array(n);(window.crypto||{}).getRandomValues?crypto.getRandomValues(r):r.forEach((_,i)=>r[i]=Math.random()*1e9);r.forEach(v=>s+=a[v%a.length]);return s;};
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dstr(new Date());
const pdate=s=>{const a=String(s).split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);};
const addDays=(s,n)=>{const d=pdate(s);d.setDate(d.getDate()+n);return dstr(d);};
const diffDays=(a,b)=>Math.round((pdate(b)-pdate(a))/864e5);
const WD=['일','월','화','수','목','금','토'];
const fmtD=s=>{const d=pdate(s);return (d.getMonth()+1)+'월 '+d.getDate()+'일 ('+WD[d.getDay()]+')';};
const fmtT=t=>{if(!t)return '';const [h,m]=t.split(':').map(Number);return (h<12?'오전 ':'오후 ')+((h%12)||12)+(m?':'+pad(m):'시');};
const won=n=>(Number(n)||0).toLocaleString('ko-KR')+'원';
const clean=o=>JSON.parse(JSON.stringify(o));
const ago=t=>{const s=(Date.now()-t)/1000;if(s<60)return '방금';if(s<3600)return Math.floor(s/60)+'분 전';if(s<86400)return Math.floor(s/3600)+'시간 전';if(s<172800)return '어제';return Math.floor(s/86400)+'일 전';};
const LS={get(k,d){try{const v=localStorage.getItem('famhub-'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('famhub-'+k,JSON.stringify(v));}catch(e){}},del(k){try{localStorage.removeItem('famhub-'+k);}catch(e){}}};
function toast(m){document.querySelectorAll('.toast').forEach(t=>t.remove());const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600);}
function b64e(s){return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function b64d(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return decodeURIComponent(escape(atob(s)));}

const MEMBER_EMOJI=['👩','👨','👧','👦','🧒','👶','👵','👴','🧑','👱‍♀️','🐱','🐶','🦊','🐰','🐻','🐼','🦁','🐯','🐸','🦄','🐧','🐨','🧙‍♀️','🦸‍♂️'];
const COLORS=['#ff8fab','#6ec3ff','#ffb84d','#5fd38d','#b794ff','#ff7b72','#4dd4c6','#f2c230'];
const EV_EMOJI=['📌','🎂','🏫','🏥','🎹','⚽','🏊','📚','🍽️','🎉','✈️','🚗','💼','🛒','💇','🦷','⛪','🎬','🏃','🎨','👶','💊','🧹','❤️'];
const TRIP_EMOJI=['✈️','🏖️','⛰️','🏕️','🚗','🚄','🏯','🎢','🌸','🍊','🏝️','❄️','🗼','🐬','🎡','🚢'];
const SHOP_DEFAULT=['우유','계란','두부','콩나물','대파','양파','사과','바나나','빵','휴지','세제','물'];
const PACK_DEFAULT=['칫솔·치약','갈아입을 옷','잠옷','속옷·양말','충전기','상비약','물티슈','선크림','모자','간식','신분증'];
const COST_CATS=[['stay','🏨 숙소'],['food','🍽️ 식비'],['move','🚗 교통'],['ticket','🎟️ 입장료'],['shop','🛍️ 쇼핑'],['etc','➕ 기타']];
const HOLIDAYS={'01-01':'신정','03-01':'삼일절','05-05':'어린이날','06-06':'현충일','08-15':'광복절','10-03':'개천절','10-09':'한글날','12-25':'성탄절'};
const REPEATS=[['none','반복 안 함'],['weekly','매주'],['monthly','매달'],['yearly','매년']];
const FB_VER='10.12.2';
const RULES=`rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /families/{fid} {
      allow get, create, update: if fid.size() >= 20;
      match /{document=**} {
        allow read, write: if fid.size() >= 20;
      }
    }
  }
}`;

/* ===== state ===== */
const COLS=['events','shop','notes','trips','diary','moods','items','money','goals'];
const S={mode:null,meta:null,metaLoaded:false,loaded:{},events:[],shop:[],notes:[],trips:[],diary:[],moods:[],items:[],money:[],goals:[],err:null,slow:false};
const UI={tab:LS.get('tab','home'),calMonth:today().slice(0,7),selDay:today(),calWho:'all',tripId:null,tripTab:'plan',packWho:'all',view:null,memDraft:null,famName:'',pending:false,refocus:null};
let backend=null;
const me=()=>{const id=LS.get('me',null);return (S.meta&&S.meta.members||[]).find(m=>m.id===id)||null;};
const member=id=>(S.meta&&S.meta.members||[]).find(m=>m.id===id);
const ava=(m,cls)=>m?'<span class="ava '+(cls||'')+'" style="--c:'+esc(m.color)+'" title="'+esc(m.name)+'">'+esc(m.emoji)+'</span>':'';
const famAva=cls=>'<span class="ava '+(cls||'')+'" style="--c:#ffd9a8" title="가족 모두">🏠</span>';

/* ===== backends ===== */
function LocalBackend(){
  let data=LS.get('demo',null)||{meta:null,events:{},shop:{},notes:{},trips:{}};
  COLS.forEach(c=>{data[c]=data[c]||{};});
  let h=null;
  const save=()=>LS.set('demo',data);
  const emit=c=>h&&h.col(c,Object.entries(data[c]).map(([id,v])=>Object.assign({},v,{id})));
  return {
    start(x){h=x;setTimeout(()=>{h.meta(data.meta);COLS.forEach(emit);},0);},
    setMeta(m){data.meta=clean(m);save();h.meta(data.meta);return Promise.resolve();},
    add(c,d){const id=uid();data[c][id]=clean(d);save();emit(c);return Promise.resolve(id);},
    set(c,id,d){data[c][id]=clean(d);save();emit(c);return Promise.resolve();},
    update(c,id,p){if(data[c][id]){Object.assign(data[c][id],clean(p));save();emit(c);}return Promise.resolve();},
    remove(c,id){delete data[c][id];save();emit(c);return Promise.resolve();}
  };
}
async function FirebaseBackend(conn){
  const base='https://www.gstatic.com/firebasejs/'+FB_VER+'/';
  const A=await import(base+'firebase-app.js');
  const F=await import(base+'firebase-firestore.js');
  const app=A.initializeApp(conn.cfg);
  let db;
  try{db=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})});}
  catch(e){db=F.getFirestore(app);}
  const fam=F.doc(db,'families',conn.fid);
  const colRef=c=>F.collection(db,'families',conn.fid,c);
  const docRef=(c,id)=>F.doc(db,'families',conn.fid,c,id);
  return {
    start(h){
      F.onSnapshot(fam,{includeMetadataChanges:false},s=>{if(!s.exists()&&s.metadata.fromCache)return;h.meta(s.exists()?s.data():null);},e=>h.error(e));
      COLS.forEach(c=>F.onSnapshot(colRef(c),qs=>h.col(c,qs.docs.map(d=>Object.assign({},d.data(),{id:d.id}))),e=>h.error(e)));
    },
    setMeta:m=>F.setDoc(fam,clean(m)),
    add:(c,d)=>F.addDoc(colRef(c),clean(d)).then(r=>r.id),
    set:(c,id,d)=>F.setDoc(docRef(c,id),clean(d)),
    update:(c,id,p)=>F.updateDoc(docRef(c,id),clean(p)),
    remove:(c,id)=>F.deleteDoc(docRef(c,id))
  };
}
function errMsg(e){
  const c=e&&e.code||'';
  if(/permission-denied/.test(c)) return '저장 권한이 없어요. Firebase 보안 규칙을 확인해 주세요.';
  if(/unavailable/.test(c)) return '인터넷 연결을 확인해 주세요. 연결되면 자동으로 저장돼요.';
  if(/not-found/.test(c)) return '데이터베이스를 찾지 못했어요. Firestore를 만들었는지 확인해 주세요.';
  if(/invalid-api-key|api-key/.test(c)) return 'Firebase 설정값이 올바르지 않아요.';
  return '문제가 생겼어요 ('+(c||(e&&e.message)||'오류')+')';
}
const db={
  add:(c,d)=>backend.add(c,d).catch(e=>toast(errMsg(e))),
  update:(c,id,p)=>{const it=S[c].find(x=>x.id===id);if(it)Object.assign(it,clean(p));return backend.update(c,id,p).catch(e=>toast(errMsg(e)));},
  remove:(c,id)=>{S[c]=S[c].filter(x=>x.id!==id);return backend.remove(c,id).catch(e=>toast(errMsg(e)));},
  set:(c,id,d)=>{S[c]=S[c].filter(x=>x.id!==id).concat(Object.assign(clean(d),{id}));return backend.set(c,id,d).catch(e=>toast(errMsg(e)));},
  setMeta:m=>backend.setMeta(m).catch(e=>toast(errMsg(e)))
};

/* ===== boot ===== */
function joinFrom(str){
  const i=String(str||'').indexOf('#join=');if(i<0) return false;
  try{const o=JSON.parse(b64d(String(str).slice(i+6).trim()));
    if(o&&o.c&&o.c.apiKey&&o.c.projectId&&o.f&&o.f.length>=20){LS.set('conn',{cfg:o.c,fid:o.f});LS.del('me');LS.del('demo');return true;}}catch(e){}
  return false;
}
const famCode=fid=>String(fid||'').slice(0,4).toUpperCase()+'-'+String(fid||'').slice(4,8).toUpperCase();
function handleJoin(){
  const h=location.hash;
  if(!h.startsWith('#join=')) return;
  try{
    const o=JSON.parse(b64d(h.slice(6)));
    if(o&&o.c&&o.c.apiKey&&o.c.projectId&&o.f&&o.f.length>=20){
      const cur=LS.get('conn',null);
      if(!cur||cur.fid!==o.f){LS.set('conn',{cfg:o.c,fid:o.f});LS.del('me');}
      UI.joined=true;
    }else toast('초대 링크가 올바르지 않아요.');
  }catch(e){toast('초대 링크가 올바르지 않아요.');}
  try{history.replaceState(null,'',location.pathname+location.search);}catch(e){location.hash='';}
}
async function boot(){
  handleJoin();
  const conn=LS.get('conn',null);
  if(conn){
    S.mode='fb';render();
    try{backend=await FirebaseBackend(conn);}catch(e){S.err='Firebase를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.';S.metaLoaded=true;render();return;}
  }else if(LS.get('demo',null)){S.mode='demo';backend=LocalBackend();}
  else{S.mode=null;render();return;}
  setTimeout(()=>{if(!S.metaLoaded){S.slow=true;render();}},10000);
  backend.start({
    meta:m=>{S.meta=m?normMeta(m):null;S.metaLoaded=true;S.slow=false;S.err=null;soft();},
    col:(c,items)=>{S[c]=items;S.loaded[c]=true;soft();},
    error:e=>{S.err=errMsg(e);S.metaLoaded=true;soft();}
  });
}
function normMeta(m){m=Object.assign({},m);m.members=Array.isArray(m.members)?m.members:[];m.name=m.name||'우리 가족';return m;}

/* ===== render ===== */
let composing=false;
document.addEventListener('compositionstart',()=>{composing=true;});
document.addEventListener('compositionend',()=>{composing=false;});
function soft(){
  const a=document.activeElement;
  if(a&&a.closest&&a.closest('#app')&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){
    if(composing||a.value||!a.id||a.tagName==='SELECT'){UI.pending=true;return;}
    UI.refocus=a.id;
  }
  render();
}
document.addEventListener('focusout',()=>setTimeout(()=>{if(UI.pending){const a=document.activeElement;if(!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))render();}},60));
function render(){
  UI.pending=false;
  const app=$('#app');let h='';
  if(UI.view==='connect') h=vConnect();
  else if(S.mode===null) h=vWelcome();
  else if(!S.metaLoaded) h='<div class="hero"><div class="big pop">🏡</div><h1>가족 공간을 여는 중...</h1>'+(S.slow?'<p class="muted">연결이 느려요. 인터넷 연결을 확인해 주세요.</p>':'')+'</div>';
  else if(S.err&&!S.meta) h='<div class="hero"><div class="big">😢</div><h1>연결에 문제가 있어요</h1><p class="muted">'+esc(S.err)+'</p><button class="btn" data-a="reload">다시 시도</button> <button class="btn ghost" data-a="disconnect">연결 다시 하기</button></div>';
  else if(!S.meta) h=vSetup();
  else if(UI.view==='settings') h=vSettings();
  else if(!me()) h=vWho();
  else h=vMain();
  app.innerHTML=h;
  if(UI.refocus){const el=document.getElementById(UI.refocus);UI.refocus=null;if(el)el.focus();}
}
function topBar(){
  const m=me();
  return '<div class="top"><div class="fam">🏡 '+esc(S.meta.name)+'</div>'+
    '<button class="me-btn" data-a="who">'+ava(m)+esc(m.name)+'</button><button class="round" data-a="settings" title="설정" style="position:relative">⚙️'+(S.mode==='fb'?'<i class="live"></i>':'')+'</button></div>'+
    (S.err?'<div class="banner">⚠️ '+esc(S.err)+'</div>':'')+
    (S.mode==='demo'?'<div class="banner" style="background:#fff1d6;color:#8a5a00">🧪 체험 모드예요. 이 기기에만 저장돼요. ⚙️ 설정에서 가족과 연결할 수 있어요.</div>':'');
}
function vMain(){
  const tabs=[['home','🏡','우리집'],['cal','🚪','일정'],['shop','🍳','장보기'],['note','🛋️','메모'],['diary','📔','일기'],['trip','🗺️','여행'],['store','🧰','창고'],['bank','🐷','은행']];
  const acc={home:'#ff9f43',cal:'#3cae6a',shop:'#ff9f43',trip:'#4e8cff',note:'#ff7aa2',diary:'#9b7bff',store:'#8a6a45',bank:'#e0a800'}[UI.tab]||'#ff9f43';
  document.documentElement.style.setProperty('--acc',acc);
  let body='';
  if(UI.tab==='cal') body=vCal();else if(UI.tab==='shop') body=vShop();else if(UI.tab==='trip') body=UI.tripId?vTrip():vTrips();else if(UI.tab==='note') body=vNotes();else if(UI.tab==='diary') body=vDiary();else if(UI.tab==='store') body=vStore();else if(UI.tab==='bank') body=vBank();else body=vHome();
  if(UI.tab!=='home'&&ROOM_HEAD[UI.tab]) body=roomHead(UI.tab)+body;
  const left=S.shop.filter(i=>!i.done).length;

/* ----- events logic ----- */
function occurs(ev,ds){
  if(!ev.date||ds<ev.date) return false;
  if(ev.end&&ev.end>ev.date&&(!ev.repeat||ev.repeat==='none')) return ds<=ev.end;
  switch(ev.repeat){
    case 'weekly':return pdate(ds).getDay()===pdate(ev.date).getDay();
    case 'monthly':return ds.slice(8)===ev.date.slice(8);
    case 'yearly':return ds.slice(5)===ev.date.slice(5);
    default:return ds===ev.date;
  }
}
function eventsOn(ds,who){
  return S.events.filter(e=>occurs(e,ds)&&(!who||who==='all'||!e.who||!e.who.length||e.who.includes(who)))
    .sort((a,b)=>(a.time||'').localeCompare(b.time||'')||String(a.title).localeCompare(String(b.title)));
}
function evRow(e,ds){
  const who=(e.who&&e.who.length)?e.who.map(member).filter(Boolean):[];
  const multi=e.end&&e.end>e.date&&(!e.repeat||e.repeat==='none');
  const sub=[e.time?fmtT(e.time):'하루 종일',multi?'('+fmtD(e.date).replace(/ \(.\)/,'')+'~'+fmtD(e.end).replace(/ \(.\)/,'')+')':'',e.repeat&&e.repeat!=='none'?'🔁 '+REPEATS.find(r=>r[0]===e.repeat)[1]:''].filter(Boolean).join(' · ');
  return '<button class="ev" data-a="ev-edit" data-id="'+esc(e.id)+'"><span class="em">'+esc(e.emoji||'📌')+'</span><span class="grow"><div class="ti">'+esc(e.title)+'</div><div class="tm">'+sub+'</div></span><span class="who">'+(who.length?who.map(m=>ava(m,'s')).join(''):famAva('s'))+'</span></button>';
}

  hh+='<div class="rpg"><div class="rpg-t">📜 오늘의 소식 · '+fmtD(t)+(HOLIDAYS[t.slice(5)]?' · '+HOLIDAYS[t.slice(5)]:'')+'</div>'+lines.map(l=>'<button class="msg" data-a="tab" data-t="'+l[0]+'"><span class="arrow">▶</span><span class="grow">'+l[1]+'</span></button>').join('')+'</div>';

function bankKids(){const ms=S.meta.members;const ids=S.meta.bank&&Array.isArray(S.meta.bank.kids)?S.meta.bank.kids:ms.slice(2).map(m=>m.id);return ms.filter(m=>ids.includes(m.id));}
function bankCfg(id){const c=(S.meta.bank&&S.meta.bank.cfg&&S.meta.bank.cfg[id])||{};return {allow:Number(c.allow||0),day:c.day==null?6:Number(c.day),save:c.save==null?20:Number(c.save),give:c.give==null?10:Number(c.give),rate:c.rate==null?5:Number(c.rate)};}
function balances(id){const b={spend:0,save:0,give:0};S.money.filter(t=>t.who===id).forEach(t=>{for(const k in b)b[k]+=Number(t.parts&&t.parts[k]||0);});b.total=b.spend+b.save+b.give;return b;}
const weekStart=ds=>addDays(ds,-((pdate(ds).getDay()+6)%7));
const allowGiven=id=>S.money.some(t=>t.who===id&&t.kind==='allow'&&t.date>=weekStart(today()));
const interestPaid=id=>S.money.some(t=>t.who===id&&t.kind==='interest'&&String(t.date).slice(0,7)===today().slice(0,7));
function addTx(id,kind,parts,label,emoji,memo){
  const amount=Object.values(parts).reduce((a,b)=>a+b,0);
  db.add('money',{who:id,kind,parts,amount,label,emoji,memo:memo||'',date:today(),by:me().id,at:Date.now()});
}
function splitIn(id,amt){const c=bankCfg(id),sv=Math.floor(amt*c.save/100),gv=Math.floor(amt*c.give/100);return {spend:amt-sv-gv,save:sv,give:gv};}

  if(c.rate>0) ai+=interestPaid(k.id)?'<div class="perk done">✅ 이번 달 이자를 받았어요</div>':(intr>0?'<button class="perk gold" data-a="give-int"><span>🪙</span><span class="grow"><b>이번 달 저금 이자 받기 · +'+won(intr)+'</b><small>모을 돈 '+won(b.save)+'의 '+c.rate+'%! 많이 모을수록 이자도 커져요</small></span></button>':'<div class="perk done">🐷 모을 돈이 생기면 매달 '+c.rate+'% 이자가 붙어요</div>');
  if(ai) h+='<div class="card">'+ai+'</div>';
  // goals
  const gs=S.goals.filter(g=>g.who===k.id&&!g.done);
  h+='<div class="card"><h3>🎯 갖고 싶은 것 <button class="btn sm" style="margin-left:auto" data-a="goal-new">＋ 목표</button></h3>'+
    (gs.length?gs.map(g=>{const p=Math.min(1,b.save/Math.max(1,g.target)),left=g.target-b.save;return '<div class="goal-row"><span class="ge">'+esc(g.emoji||'🎁')+'</span><div class="grow"><div class="row"><span class="j grow" style="font-size:17px">'+esc(g.name)+'</span><span class="small">'+won(g.target)+'</span></div><div class="bar" style="--c:#f2b705;margin:6px 0 4px"><i style="width:'+(p*100).toFixed(1)+'%"></i></div>'+
      '<div class="small muted">'+(left>0?'🐷 모을 돈으로 '+won(left)+' 더 모으면 돼요! ('+Math.round(p*100)+'%)':'🎉 다 모았어요!')+'</div>'+
      '<div class="row" style="gap:6px;margin-top:6px">'+(left<=0?'<button class="btn sm" data-a="goal-buy" data-id="'+esc(g.id)+'">🛍️ 샀어요!</button>':'')+'<button class="mini-b" data-a="goal-del" data-id="'+esc(g.id)+'">🗑</button></div></div></div>';}).join(''):'<div class="empty">갖고 싶은 걸 정하고 모을 돈으로 모아 봐요! 🌟</div>')+'</div>';
  // ledger
  const txs=S.money.filter(x=>x.who===k.id).sort((a,b)=>(b.at||0)-(a.at||0));
  const mon=t.slice(0,7),mt=txs.filter(x=>String(x.date).slice(0,7)===mon);
  const inM=mt.filter(x=>x.kind!=='out'&&x.kind!=='move').reduce((a,x)=>a+x.amount,0),outM=mt.filter(x=>x.kind==='out').reduce((a,x)=>a-x.amount,0);
  let rows='',last='';
  txs.slice(0,UI.txN||30).forEach(x=>{if(x.date!==last){rows+='<div class="day-head">'+fmtD(x.date)+'</div>';last=x.date;}
    const pos=x.kind!=='out'&&x.kind!=='move',jar=x.kind==='move'?'':JARS.filter(j=>x.parts&&x.parts[j[0]]).map(j=>j[1]).join('');
    rows+='<div class="item"><span class="iem">'+esc(x.emoji||'💰')+'</span><div class="grow"><div class="nm" style="font-size:16px">'+esc(x.label||'')+(x.memo?' <span class="muted small">'+esc(x.memo)+'</span>':'')+'</div><div class="meta">'+jar+(member(x.by)?' · '+esc(member(x.by).name)+' 기록':'')+'</div></div>'+
      '<span class="j" style="color:'+(x.kind==='move'?'var(--sub)':pos?'#1f9d55':'#e04848')+'">'+(x.kind==='move'?'🔁 '+won(Math.abs(Object.values(x.parts).find(v=>v>0)||0)):(pos?'+':'−')+won(Math.abs(x.amount)))+'</span><button class="x" data-a="tx-del" data-id="'+esc(x.id)+'">✕</button></div>';});
  h+='<div class="card"><h3>📒 용돈 기입장</h3><div class="row" style="gap:8px;margin-bottom:6px"><div class="stat-b"><small>이번 달 들어온 돈</small><b style="color:#1f9d55">+'+won(inM)+'</b></div><div class="stat-b"><small>이번 달 쓴 돈</small><b style="color:#e04848">−'+won(outM)+'</b></div></div>'+
    (rows||'<div class="empty">아직 기록이 없어요. 용돈을 받으면 적어 봐요! ✏️</div>')+(txs.length>(UI.txN||30)?'<button class="btn ghost wide sm" style="margin-top:8px" data-a="tx-more">더 보기</button>':'')+'</div>';
  return h;
}
function amtVal(sel){return Number(String($(sel).value).replace(/[^\d]/g,''))||0;}

  body+='<label class="lbl">메모 (선택)</label><input class="inp" id="x-memo" maxlength="40" placeholder="'+(kind==='in'?'예: 할머니가 주심':'예: 친구랑 떡볶이')+'">'+

  const prev=()=>{const p=$('#x-prev');if(!p)return;const a=amtVal('#x-amt');const on=$('#x-split').checked;$('#x-jar').style.display=on?'none':'flex';

function vCal(){
  const [y,mo]=UI.calMonth.split('-').map(Number);
  const first=new Date(y,mo-1,1),start=addDays(dstr(first),-first.getDay());
  const t=today();
  let g=WD.map(w=>'<div class="h">'+w+'</div>').join('');
  for(let i=0;i<42;i++){
    const ds=addDays(start,i),d=pdate(ds),out=d.getMonth()!==mo-1;
    if(i===35&&out) break;
    const evs=eventsOn(ds,UI.calWho),hol=HOLIDAYS[ds.slice(5)];
    const dots=evs.slice(0,4).map(e=>{const w=e.who&&e.who.length?member(e.who[0]):null;return '<i style="--c:'+(w?esc(w.color):'#ffb15c')+'"></i>';}).join('');

    '<div class="scroll-chips" style="margin-bottom:10px"><button class="chip '+(UI.calWho==='all'?'on':'')+'" data-a="cal-who" data-id="all">🏠 모두</button>'+S.meta.members.map(m=>'<button class="chip '+(UI.calWho===m.id?'on':'')+'" style="--c:'+esc(m.color)+'" data-a="cal-who" data-id="'+esc(m.id)+'">'+esc(m.emoji)+' '+esc(m.name)+'</button>').join('')+'</div>'+

function shopAdd(text){
  text=String(text||'').trim();if(!text) return;
  let name=text,qty='';
  const m=text.match(/^(.*?)\s+(\d+\s*[^\s\d]*)$/);
  if(m&&m[1]){name=m[1].trim();qty=m[2].trim();}
  const ex=S.shop.find(i=>i.name===name);
  if(ex){db.update('shop',ex.id,{done:false,qty:qty||ex.qty||'',at:Date.now(),by:me().id});}
  else db.add('shop',{name,qty,done:false,by:me().id,at:Date.now()});
}

  const cs=tr.cost||[],sum=cs.reduce((a,c)=>a+(Number(c.amount)||0),0),bud=Number(tr.budget)||0;
  const by={};cs.forEach(c=>{by[c.cat]=(by[c.cat]||0)+(Number(c.amount)||0);});
  return '<div class="card"><h3>💰 여행 경비</h3><div class="row"><div class="grow"><div class="muted small">지금까지 쓴 돈</div><div class="money">'+won(sum)+'</div></div>'+(bud?'<div style="text-align:right"><div class="muted small">예산 '+won(bud)+'</div><div class="j" style="color:'+(sum>bud?'var(--red)':'var(--green)')+'">'+(sum>bud?won(sum-bud)+' 초과':won(bud-sum)+' 남음')+'</div></div>':'')+'</div>'+
    (bud?'<div class="bar" style="margin-top:8px;--c:'+(sum>bud?'var(--red)':'var(--purple)')+'"><i style="width:'+Math.min(100,sum/bud*100)+'%"></i></div>':'<p class="muted small">✏️ 고치기에서 예산을 정하면 남은 돈을 보여줘요.</p>')+
    (cs.length?'<div class="chips" style="margin-top:12px">'+COST_CATS.filter(c=>by[c[0]]).map(c=>'<span class="chip">'+c[1]+' '+won(by[c[0]])+'</span>').join('')+'</div>':'')+'</div>'+
    '<div class="card"><h3>➕ 쓴 돈 적기</h3><div class="scroll-chips" id="c-cat" style="margin-bottom:8px">'+COST_CATS.map((c,i)=>'<button type="button" class="chip '+(i===1?'on':'')+'" data-v="'+c[0]+'" style="--c:var(--purple)">'+c[1]+'</button>').join('')+'</div>'+
    '<div class="row"><input class="inp grow" id="c-text" placeholder="내용 (예: 흑돼지)" maxlength="30"><input class="inp" id="c-amt" inputmode="numeric" placeholder="금액" style="width:110px;flex:none" data-enter="cost-add"><button class="btn sm" data-a="cost-add">＋</button></div>'+
    (cs.length?'<div style="margin-top:10px">'+cs.slice().sort((a,b)=>(b.at||0)-(a.at||0)).map(c=>{const cat=COST_CATS.find(x=>x[0]===c.cat)||COST_CATS[5];return '<div class="item"><span style="font-size:22px">'+cat[1].split(' ')[0]+'</span><div class="grow"><div class="nm" style="font-size:16px">'+esc(c.text||cat[1].split(' ')[1])+'</div><div class="meta">'+(member(c.by)?esc(member(c.by).name)+' · ':'')+ago(c.at)+'</div></div><span class="j">'+won(c.amount)+'</span><button class="x" data-a="cost-del" data-id="'+esc(c.id)+'">✕</button></div>';}).join('')+'</div>':'')+'</div>';
}

/* ===== sheet (modal) ===== */
let sheetH=null;
function openSheet(html,handlers){sheetH=handlers||{};$('#sheet').innerHTML=html;$('#modal').classList.add('open');if(sheetH.mount)sheetH.mount();}
function closeSheet(){$('#modal').classList.remove('open');$('#sheet').innerHTML='';sheetH=null;if(UI.pending)render();}
$('#modal').addEventListener('click',e=>{
  if(e.target.id==='modal'){closeSheet();return;}
  const b=e.target.closest('[data-s]');if(!b||!sheetH) return;
  const k=b.dataset.s;if(k==='close'){closeSheet();return;}
  if(sheetH[k]) sheetH[k].call(b,b);
});
function confirmTwice(btn){if(btn.dataset.sure)return false;btn.dataset.sure='1';btn.textContent='정말 삭제?';setTimeout(()=>{if(btn.isConnected){delete btn.dataset.sure;btn.textContent='삭제';}},3000);return true;}
function singlePick(sel){const g=$(sel);g.addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(!b)return;g.querySelectorAll('.on').forEach(x=>x.classList.remove('on'));b.classList.add('on');});}
function multiPick(sel){const g=$(sel);g.addEventListener('click',e=>{const b=e.target.closest('[data-v]');if(b)b.classList.toggle('on');});}
const pickVal=sel=>{const b=document.querySelector(sel+' .on');return b?b.dataset.v:'';};
const pickVals=sel=>[...document.querySelectorAll(sel+' .on')].map(b=>b.dataset.v);
function emojiSheet(list,cur,cb){openSheet('<h2>그림 고르기</h2><div class="emo-grid" style="margin-top:12px">'+list.map(x=>'<button data-s="pick" data-v="'+x+'" class="'+(x===cur?'on':'')+'">'+x+'</button>').join('')+'</div><button class="btn ghost wide" style="margin-top:14px" data-s="close">닫기</button>',{pick(b){closeSheet();cb(b.dataset.v);}});}
function copyText(t,okMsg){
  const done=()=>toast(okMsg);
  try{if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(done,()=>fallback());return;}}catch(e){}
  fallback();
  function fallback(){const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done();}catch(e){toast('복사하지 못했어요. 길게 눌러 직접 복사해 주세요.');}ta.remove();}
}

function memValid(){
  readMemNames();

  if(!ms.length){toast('가족을 한 명 이상 적어 주세요');return null;}
  return ms;
}
